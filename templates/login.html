<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Bus Tracking</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-body">
<div class="auth-card">
    <div class="logo">🚌</div>
    <h1>BusTrack</h1>
    <p class="subtitle">Real-Time Bus Tracking System</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form method="POST">
        <label>Mobile number or Email</label>
        <input type="text" name="identifier" placeholder="Enter mobile or email" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter password" required>

        <button type="submit">Login</button>
    </form>

    <p class="switch">Don't have an account?
        <a href="{{ url_for('signup') }}">Create account</a>
    </p>

    <div class="demo">
        <strong>Demo Login</strong><br>
        Email: demo@bus.com<br>
        Mobile: 9876543210<br>
        Password: 123456
    </div>
</div>
</body>
</html>
